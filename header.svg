<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c222b"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .sm  { font-size: 13px; }
    @media (prefers-reduced-motion: no-preference) {
      .fade { animation: fadeIn 0.3s ease-out both; }
      .ch   { animation: fadeIn 1ms steps(1) both; }
      .cursor { animation: blink 1.1s steps(1) infinite; animation-delay: 2.8s; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    }
  </style>

  <!-- ── window ─────────────────────────────────────── -->
  <rect x="14" y="10" width="892" height="448" rx="12" fill="#0d1117" filter="url(#shadow)"/>
  <rect x="14" y="10" width="892" height="44" rx="12" fill="url(#titlebar)"/>
  <rect x="14" y="32" width="892" height="22" fill="#161b22"/>
  <line x1="14" y1="54" x2="906" y2="54" stroke="#30363d" stroke-width="1"/>
  <circle cx="38" cy="32" r="6.5" fill="#ff5f57"/>
  <circle cx="60" cy="32" r="6.5" fill="#febc2e"/>
  <circle cx="82" cy="32" r="6.5" fill="#28c840"/>
  <text x="460" y="37" text-anchor="middle" class="sm" fill="#8b949e">milad — -zsh — 120×34</text>

  <!-- ── $ neofetch ─────────────────────────────────── -->
  <text x="38" y="88"><tspan fill="#3fb950">milad@Milads-MacBook-Pro</tspan><tspan fill="#58a6ff"> ~</tspan><tspan fill="#8b949e"> %</tspan></text>
  <text y="88" fill="#e6edf3">
    <tspan x="300" class="ch" style="animation-delay:.2s">n</tspan><tspan x="309" class="ch" style="animation-delay:.26s">e</tspan><tspan x="318" class="ch" style="animation-delay:.32s">o</tspan><tspan x="327" class="ch" style="animation-delay:.38s">f</tspan><tspan x="336" class="ch" style="animation-delay:.44s">e</tspan><tspan x="345" class="ch" style="animation-delay:.5s">t</tspan><tspan x="354" class="ch" style="animation-delay:.56s">c</tspan><tspan x="363" class="ch" style="animation-delay:.62s">h</tspan>
  </text>

