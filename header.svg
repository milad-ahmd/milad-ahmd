<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <clipPath id="cmd1clip">
      <rect x="173" y="74" width="0" height="26">
        <animate attributeName="width" from="0" to="75" begin="0.4s" dur="0.5s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cmd2clip">
      <rect x="173" y="206" width="0" height="26">
        <animate attributeName="width" from="0" to="285" begin="2.4s" dur="0.8s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="904" height="414" rx="12" fill="#0d1117"/>
  <rect x="9" y="9" width="902" height="43" rx="11" fill="#161b22"/>
  <rect x="9" y="30" width="902" height="22" fill="#161b22"/>
  <line x1="9" y1="52" x2="911" y2="52" stroke="#30363d" stroke-width="1"/>
  <circle cx="34" cy="30" r="7" fill="#ff5f57"/>
  <circle cx="58" cy="30" r="7" fill="#febc2e"/>
  <circle cx="82" cy="30" r="7" fill="#28c840"/>
  <text x="460" y="35" text-anchor="middle" font-size="13" fill="#8b949e">milad@production: ~ (zsh)</text>

  <!-- ── command 1 ───────────────────────────── -->
  <text x="40" y="90" font-size="16">
    <tspan fill="#3fb950">milad@prod</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan>
  </text>
  <g clip-path="url(#cmd1clip)">
    <text x="175" y="90" font-size="16" fill="#e6edf3">whoami</text>
  </g>

  <text x="40" y="122" font-size="16" font-weight="600" fill="#e6edf3" opacity="0">
    Milad Ahmadi — Senior Software Engineer
    <animate attributeName="opacity" from="0" to="1" begin="1.15s" dur="0.25s" fill="freeze"/>
  </text>
  <text x="40" y="150" font-size="16" fill="#c9d1d9" opacity="0">
    Java · Spring Boot · Go — high-throughput, event-driven systems
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.25s" fill="freeze"/>
  </text>
  <text x="40" y="178" font-size="16" fill="#8b949e" opacity="0">
    9+ yrs · FinTech / Logistics / Mobility · Kafka · Kubernetes · AWS
    <animate attributeName="opacity" from="0" to="1" begin="1.65s" dur="0.25s" fill="freeze"/>
  </text>

  <!-- ── command 2 ───────────────────────────── -->
  <text x="40" y="222" font-size="16" opacity="0">
    <tspan fill="#3fb950">milad@prod</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.15s" fill="freeze"/>
  </text>
  <g clip-path="url(#cmd2clip)">
    <text x="175" y="222" font-size="16" fill="#e6edf3">kubectl get engineer -o wide</text>
  </g>

  <g opacity="0" font-size="15">
    <animate attributeName="opacity" from="0" to="1" begin="3.45s" dur="0.25s" fill="freeze"/>
    <text x="40"  y="254" fill="#8b949e">NAME</text>
    <text x="190" y="254" fill="#8b949e">READY</text>
    <text x="270" y="254" fill="#8b949e">STATUS</text>
    <text x="400" y="254" fill="#8b949e">LOCATION</text>
    <text x="665" y="254" fill="#8b949e">ROLE</text>
  </g>
  <g opacity="0" font-size="15">
    <animate attributeName="opacity" from="0" to="1" begin="3.75s" dur="0.25s" fill="freeze"/>
    <text x="40"  y="282" fill="#e6edf3">milad-ahmadi</text>
    <text x="190" y="282" fill="#c9d1d9">1/1</text>
    <circle cx="276" cy="277" r="4" fill="#3fb950"/>
    <text x="288" y="282" fill="#3fb950">Running</text>
    <text x="400" y="282" fill="#c9d1d9">Tehran, IR → Amsterdam, NL</text>
    <text x="665" y="282" fill="#c9d1d9">senior-backend</text>
  </g>

  <!-- ── idle prompt + cursor ─────────────────── -->
  <text x="40" y="326" font-size="16" opacity="0">
    <tspan fill="#3fb950">milad@prod</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.2s" fill="freeze"/>
  </text>
  <rect x="175" y="311" width="10" height="20" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" calcMode="discrete" dur="1.1s" begin="5s" repeatCount="indefinite"/>
  </rect>

  <text x="460" y="400" text-anchor="middle" font-size="12" fill="#3d444d">— hand-crafted animated SVG · self-hosted · zero external widget services —</text>

  <!-- border on top -->
  <rect x="8" y="8" width="904" height="414" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>
