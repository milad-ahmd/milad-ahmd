  <!-- ── neofetch colour strip ──────────────────────── -->
  <g class="fade" style="animation-delay:2.05s">
    <rect x="364" y="394" width="16" height="12" fill="#21262d"/>
    <rect x="382" y="394" width="16" height="12" fill="#f85149"/>
