    <rect x="44" y="316" width="28" height="24" rx="2" fill="#238636"/><rect x="194" y="316" width="28" height="24" rx="2" fill="#238636"/>
    <rect x="44" y="342" width="28" height="24" rx="2" fill="#238636"/><rect x="194" y="342" width="28" height="24" rx="2" fill="#238636"/>
