<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 478">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c222b"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .sm  { font-size: 13px; }
    @media (prefers-reduced-motion: no-preference) {
      .fade { animation: fadeIn 0.3s ease-out both; }
      .ch   { animation: fadeIn 1ms steps(1) both; }
      .cursor { animation: blink 1.1s steps(1) infinite; animation-delay: 3s; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    }
  </style>

  <!-- ── window ─────────────────────────────────────── -->
  <rect x="14" y="10" width="892" height="452" rx="12" fill="#0d1117" filter="url(#shadow)"/>
  <rect x="14" y="10" width="892" height="44" rx="12" fill="url(#titlebar)"/>
  <rect x="14" y="32" width="892" height="22" fill="#161b22"/>
  <line x1="14" y1="54" x2="906" y2="54" stroke="#30363d" stroke-width="1"/>
  <circle cx="38" cy="32" r="6.5" fill="#ff5f57"/>
  <circle cx="60" cy="32" r="6.5" fill="#febc2e"/>
  <circle cx="82" cy="32" r="6.5" fill="#28c840"/>
  <text x="460" y="37" text-anchor="middle" class="sm" fill="#8b949e">milad — -zsh — 120×34</text>

  <!-- ── $ neofetch ─────────────────────────────────── -->
  <text x="38" y="92"><tspan fill="#3fb950">milad@Milads-MacBook-Pro</tspan><tspan fill="#58a6ff"> ~</tspan><tspan fill="#8b949e"> %</tspan></text>
  <text y="92" fill="#e6edf3">
    <tspan x="300" class="ch" style="animation-delay:.25s">n</tspan><tspan x="309" class="ch" style="animation-delay:.31s">e</tspan><tspan x="318" class="ch" style="animation-delay:.37s">o</tspan><tspan x="327" class="ch" style="animation-delay:.43s">f</tspan><tspan x="336" class="ch" style="animation-delay:.49s">e</tspan><tspan x="345" class="ch" style="animation-delay:.55s">t</tspan><tspan x="354" class="ch" style="animation-delay:.61s">c</tspan><tspan x="363" class="ch" style="animation-delay:.67s">h</tspan>
  </text>

  <!-- ── ascii coffee (java!) ───────────────────────── -->
  <g class="fade" style="animation-delay:.95s" fill="#3fb950">
    <text x="38" y="150" xml:space="preserve">      ( (</text>
    <text x="38" y="176" xml:space="preserve">       ) )</text>
    <text x="38" y="202" xml:space="preserve">    ..........</text>
    <text x="38" y="228" xml:space="preserve">    |        |]</text>
    <text x="38" y="254" xml:space="preserve">    |        |</text>
    <text x="38" y="280" xml:space="preserve">    \        /</text>
    <text x="38" y="306" xml:space="preserve">     `------'</text>
  </g>

  <!-- ── neofetch info ──────────────────────────────── -->
  <text x="260" y="150" class="fade" style="animation-delay:1s"><tspan fill="#3fb950" font-weight="700">milad</tspan><tspan fill="#c9d1d9">@</tspan><tspan fill="#3fb950" font-weight="700">Milads-MacBook-Pro</tspan></text>
  <text x="260" y="176" class="fade" style="animation-delay:1.05s" fill="#444c56">──────────────────────────</text>

  <g>
    <text x="260" y="202" class="fade" style="animation-delay:1.1s"><tspan fill="#3fb950" font-weight="700">Role:</tspan></text>
    <text x="360" y="202" class="fade" style="animation-delay:1.1s" fill="#c9d1d9">Senior Software Engineer — full-stack, backend-heavy</text>

    <text x="260" y="228" class="fade" style="animation-delay:1.22s"><tspan fill="#3fb950" font-weight="700">Uptime:</tspan></text>
    <text x="360" y="228" class="fade" style="animation-delay:1.22s" fill="#c9d1d9">9+ years in production</text>

    <text x="260" y="254" class="fade" style="animation-delay:1.34s"><tspan fill="#3fb950" font-weight="700">Backend:</tspan></text>
    <text x="360" y="254" class="fade" style="animation-delay:1.34s" fill="#c9d1d9">Java 21 · Spring Boot · Go · NestJS · Kafka · gRPC</text>

    <text x="260" y="280" class="fade" style="animation-delay:1.46s"><tspan fill="#3fb950" font-weight="700">Frontend:</tspan></text>
    <text x="360" y="280" class="fade" style="animation-delay:1.46s" fill="#c9d1d9">React · Next.js · React Native · TypeScript</text>

    <text x="260" y="306" class="fade" style="animation-delay:1.58s"><tspan fill="#3fb950" font-weight="700">Data:</tspan></text>
    <text x="360" y="306" class="fade" style="animation-delay:1.58s" fill="#c9d1d9">PostgreSQL · MongoDB · Redis · ClickHouse · Elasticsearch</text>

    <text x="260" y="332" class="fade" style="animation-delay:1.7s"><tspan fill="#3fb950" font-weight="700">Cloud:</tspan></text>
    <text x="360" y="332" class="fade" style="animation-delay:1.7s" fill="#c9d1d9">AWS · Kubernetes · Docker · Terraform · Helm</text>

    <text x="260" y="358" class="fade" style="animation-delay:1.82s"><tspan fill="#3fb950" font-weight="700">Domains:</tspan></text>
    <text x="360" y="358" class="fade" style="animation-delay:1.82s" fill="#c9d1d9">fintech · logistics · mobility · e-commerce</text>

    <text x="260" y="384" class="fade" style="animation-delay:1.94s"><tspan fill="#3fb950" font-weight="700">Location:</tspan></text>
    <text x="360" y="384" class="fade" style="animation-delay:1.94s" fill="#c9d1d9">Tehran, IR → Amsterdam, NL · visa sponsorship</text>
  </g>

  <!-- ── neofetch colour strip ──────────────────────── -->
  <g class="fade" style="animation-delay:2.2s">
    <rect x="360" y="398" width="16" height="12" fill="#21262d"/>
    <rect x="378" y="398" width="16" height="12" fill="#f85149"/>
    <rect x="396" y="398" width="16" height="12" fill="#3fb950"/>
    <rect x="414" y="398" width="16" height="12" fill="#d29922"/>
    <rect x="432" y="398" width="16" height="12" fill="#58a6ff"/>
    <rect x="450" y="398" width="16" height="12" fill="#bc8cff"/>
    <rect x="468" y="398" width="16" height="12" fill="#39c5cf"/>
    <rect x="486" y="398" width="16" height="12" fill="#c9d1d9"/>
  </g>

  <!-- ── idle prompt ────────────────────────────────── -->
  <text x="38" y="440" class="fade" style="animation-delay:2.6s"><tspan fill="#3fb950">milad@Milads-MacBook-Pro</tspan><tspan fill="#58a6ff"> ~</tspan><tspan fill="#8b949e"> %</tspan></text>
  <rect x="300" y="426" width="9" height="18" fill="#3fb950" class="cursor"/>
</svg>
