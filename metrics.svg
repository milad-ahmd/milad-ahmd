<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340">
  <defs>
    <linearGradient id="upfill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <clipPath id="mixclip"><rect x="24" y="278" width="872" height="14" rx="7"/></clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    @media (prefers-reduced-motion: no-preference) {
      .fade { animation: fadeIn 0.45s ease-out both; }
      .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s ease-out both; animation-delay: 0.4s; }
      .live { animation: pulse 2s ease-in-out infinite; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes pulse  { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    }
  </style>

  <rect x="8" y="8" width="904" height="324" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <text x="28" y="38" font-size="13" fill="#8b949e">production dashboard — 9 years in service</text>
  <circle cx="836" cy="33" r="4" fill="#3fb950" class="live"/>
  <text x="848" y="38" font-size="12" fill="#3fb950">LIVE</text>
  <line x1="9" y1="52" x2="911" y2="52" stroke="#21262d" stroke-width="1"/>

  <!-- panel 1 : settlement -->
  <rect x="24" y="64" width="202" height="136" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="92" font-size="11" fill="#8b949e" letter-spacing="1">SETTLEMENT ENGINE</text>
  <text x="40" y="132" font-size="28" font-weight="700" fill="#3fb950" class="fade" style="animation-delay:.3s">100K+</text>
  <text x="40" y="154" font-size="11" fill="#8b949e">trades/day · P99 &lt;100ms</text>
  <g transform="translate(40,166)">
    <polyline points="0,24 17,19 34,21 51,14 68,17 85,10 102,12 119,7 136,9 153,4 170,5" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="170" cy="5" r="3" fill="#3fb950"/>
  </g>

  <!-- panel 2 : concurrency -->
  <rect x="250" y="64" width="202" height="136" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="266" y="92" font-size="11" fill="#8b949e" letter-spacing="1">CONCURRENT SESSIONS</text>
  <text x="266" y="132" font-size="28" font-weight="700" fill="#3fb950" class="fade" style="animation-delay:.5s">60K</text>
  <text x="266" y="154" font-size="11" fill="#8b949e">reactive · &lt;150ms e2e</text>
  <g transform="translate(266,166)">
    <polyline points="0,25 17,21 34,22 51,16 68,18 85,12 102,14 119,8 136,10 153,6 170,4" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle cx="170" cy="4" r="3" fill="#2dd4bf"/>
  </g>

  <!-- panel 3 : frontend web vitals -->
  <rect x="476" y="64" width="202" height="136" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="492" y="92" font-size="11" fill="#8b949e" letter-spacing="1">FRONTEND WEB VITALS</text>
  <text x="492" y="132" font-size="28" font-weight="700" fill="#3fb950" class="fade" style="animation-delay:.7s">96/100</text>
  <text x="492" y="154" font-size="11" fill="#8b949e">Lighthouse — from 68</text>
  <g transform="translate(492,166)">
    <polyline points="0,24 17,22 34,18 51,19 68,14 85,15 102,10 119,11 136,7 153,5 170,3" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="170" cy="3" r="3" fill="#3fb950"/>
  </g>

  <!-- panel 4 : finops (down = good) -->
  <rect x="702" y="64" width="202" height="136" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="718" y="92" font-size="11" fill="#8b949e" letter-spacing="1">FINOPS SAVINGS</text>
  <text x="718" y="132" font-size="28" font-weight="700" fill="#3fb950" class="fade" style="animation-delay:.9s">−27%</text>
  <text x="718" y="154" font-size="11" fill="#8b949e">Graviton2 migration</text>
  <g transform="translate(718,166)">
    <polyline points="0,5 17,8 34,6 51,12 68,10 85,16 102,14 119,20 136,18 153,23 170,26" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle cx="170" cy="26" r="3" fill="#2dd4bf"/>
  </g>

  <!-- uptime -->
  <text x="24" y="232" font-size="11" fill="#8b949e" letter-spacing="1">UPTIME SLO</text>
  <text x="896" y="232" font-size="12" fill="#3fb950" text-anchor="end">99.9% — held through migrations &amp; peak traffic</text>
  <rect x="24" y="240" width="872" height="14" rx="7" fill="#21262d"/>
  <rect x="24" y="240" width="871" height="14" rx="7" fill="url(#upfill)" class="grow"/>

  <!-- stack mix -->
  <text x="24" y="274" font-size="11" fill="#8b949e" letter-spacing="1">STACK MIX — LANGUAGES IN PRODUCTION</text>
  <g clip-path="url(#mixclip)">
    <rect x="24"  y="278" width="332" height="14" fill="#b07219" class="fade" style="animation-delay:.5s"/>
    <rect x="356" y="278" width="227" height="14" fill="#3178c6" class="fade" style="animation-delay:.65s"/>
    <rect x="583" y="278" width="148" height="14" fill="#f1e05a" class="fade" style="animation-delay:.8s"/>
    <rect x="731" y="278" width="96"  height="14" fill="#00ADD8" class="fade" style="animation-delay:.95s"/>
    <rect x="827" y="278" width="69"  height="14" fill="#6e7681" class="fade" style="animation-delay:1.1s"/>
  </g>
  <text x="24" y="316" font-size="11" class="fade" style="animation-delay:1.3s"><tspan fill="#b07219">●</tspan><tspan fill="#8b949e"> Java 38%   </tspan><tspan fill="#3178c6">●</tspan><tspan fill="#8b949e"> TypeScript 26%   </tspan><tspan fill="#f1e05a">●</tspan><tspan fill="#8b949e"> JavaScript 17%   </tspan><tspan fill="#00ADD8">●</tspan><tspan fill="#8b949e"> Go 11%   </tspan><tspan fill="#6e7681">●</tspan><tspan fill="#8b949e"> SQL / other 8%</tspan></text>
</svg>
