<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="upfill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="904" height="284" rx="12" fill="#0d1117"/>

  <text x="28" y="38" font-size="13" fill="#8b949e">SLO / production dashboard — 9 years in service</text>
  <circle cx="836" cy="33" r="4" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="848" y="38" font-size="12" fill="#3fb950">LIVE</text>
  <line x1="9" y1="52" x2="911" y2="52" stroke="#21262d" stroke-width="1"/>

  <!-- panel 1 : settlement -->
  <g>
    <rect x="24" y="64" width="202" height="136" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="92" font-size="11" fill="#8b949e" letter-spacing="1">SETTLEMENT THROUGHPUT</text>
    <text x="40" y="132" font-size="28" font-weight="700" fill="#3fb950" opacity="0">100K+
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="40" y="154" font-size="11" fill="#8b949e">trades/day · P99 &lt; 100 ms</text>
    <g transform="translate(40,166)">
      <polyline points="0,24 17,19 34,21 51,14 68,17 85,10 102,12 119,7 136,9 153,4 170,5" fill="none" stroke="#3fb950" stroke-width="1.5"/>
      <circle cx="170" cy="5" r="3" fill="#3fb950"/>
    </g>
  </g>

  <!-- panel 2 : concurrency -->
  <g>
    <rect x="250" y="64" width="202" height="136" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="266" y="92" font-size="11" fill="#8b949e" letter-spacing="1">CONCURRENT SESSIONS</text>
    <text x="266" y="132" font-size="28" font-weight="700" fill="#3fb950" opacity="0">60K
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="266" y="154" font-size="11" fill="#8b949e">reactive · &lt; 150 ms e2e</text>
    <g transform="translate(266,166)">
      <polyline points="0,25 17,21 34,22 51,16 68,18 85,12 102,14 119,8 136,10 153,6 170,4" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
      <circle cx="170" cy="4" r="3" fill="#2dd4bf"/>
    </g>
  </g>

  <!-- panel 3 : MTTR (down = good) -->
  <g>
    <rect x="476" y="64" width="202" height="136" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="492" y="92" font-size="11" fill="#8b949e" letter-spacing="1">MTTR (RECOVERY)</text>
    <text x="492" y="132" font-size="28" font-weight="700" fill="#3fb950" opacity="0">22 min
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="492" y="154" font-size="11" fill="#8b949e">down from 40 min · GitOps</text>
    <g transform="translate(492,166)">
      <polyline points="0,4 17,7 34,5 51,11 68,9 85,15 102,13 119,19 136,17 153,22 170,25" fill="none" stroke="#3fb950" stroke-width="1.5"/>
      <circle cx="170" cy="25" r="3" fill="#3fb950"/>
    </g>
  </g>

  <!-- panel 4 : finops (down = good) -->
  <g>
    <rect x="702" y="64" width="202" height="136" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="718" y="92" font-size="11" fill="#8b949e" letter-spacing="1">CLOUD SPEND — FINOPS</text>
    <text x="718" y="132" font-size="28" font-weight="700" fill="#3fb950" opacity="0">−27%
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="718" y="154" font-size="11" fill="#8b949e">Graviton2 · no app changes</text>
    <g transform="translate(718,166)">
      <polyline points="0,5 17,8 34,6 51,12 68,10 85,16 102,14 119,20 136,18 153,23 170,26" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
      <circle cx="170" cy="26" r="3" fill="#2dd4bf"/>
    </g>
  </g>

  <!-- uptime bar -->
  <text x="24" y="232" font-size="11" fill="#8b949e" letter-spacing="1">UPTIME SLO</text>
  <text x="896" y="232" font-size="12" fill="#3fb950" text-anchor="end">99.9% — held through migrations &amp; peak traffic</text>
  <rect x="24" y="240" width="872" height="14" rx="7" fill="#21262d"/>
  <rect x="24" y="240" width="0" height="14" rx="7" fill="url(#upfill)">
    <animate attributeName="width" from="0" to="871" begin="0.4s" dur="1.4s" fill="freeze"/>
  </rect>

  <rect x="8" y="8" width="904" height="284" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>
